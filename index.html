<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名牌產生器 Web 版</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400&family=Noto+Serif+TC:wght@400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f7fa; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { text-align: center; color: #0B3D91; }
        h3 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; color: #0B3D91; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="color"] { padding: 2px; height: 35px; }
        button { background: #0B3D91; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;}
        button:hover { background: #082d6b; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #4CAF50; }
        .btn-secondary:hover { background: #45a049; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #d9534f; }
        .checkbox-label { display: flex; align-items: center; font-weight: normal; margin-top: 25px; cursor: pointer; }
        .checkbox-label input { width: auto; margin-right: 10px; cursor: pointer; }
        
        .preview-container { background: #eef2f5; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; }
        #previewCanvas { max-width: 100%; max-height: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background: white; }
    </style>
</head>
<body>

    <h1>🪪 雙語名牌產生器</h1>
    <div id="status"></div> <div class="card">
        <h3>⚙️ 名牌樣式設定</h3>
        <div class="grid">
            <div>
                <label>預設樣式</label>
                <select id="presetSelect" onchange="applyPreset()">
                    <option value="手機藍白">手機藍白</option>
                    <option value="A4黑白">A4黑白</option>
                </select>
            </div>
            <div>
                <label>選擇字體</label>
                <select id="fontSelect" onchange="handleFontChange()">
                    <option value="'Noto Sans TC'">思源黑體 (標準)</option>
                    <option value="'Noto Serif TC'">思源宋體 (典雅)</option>
                    <option value="'LXGW WenKai TC'">霞鶩文楷 (雲端楷體)</option>
                    <option value="'Ma Shan Zheng'">毛筆體 (藝術)</option>
                    <option value="'Zhi Mang Xing'">行書體 (動感)</option>
                </select>
            </div>
            <div>
                <label class="checkbox-label">
                    <input type="checkbox" id="foreignFirst" onchange="updatePreview()"> <b>外文姓名在上</b>
                </label>
            </div>
            <div><label>字體大小 (px)</label><input type="number" id="fontPx" oninput="updatePreview()"></div>
            <div><label>兩行文字間距 (px)</label><input type="number" id="gapPx" oninput="updatePreview()"></div>
            <div><label>寬度 (W)</label><input type="number" id="imgW" oninput="updatePreview()"></div>
            <div><label>高度 (H)</label><input type="number" id="imgH" oninput="updatePreview()"></div>
            <div><label>背景顏色</label><input type="color" id="bgColor" oninput="updatePreview()"></div>
            <div><label>字體顏色</label><input type="color" id="fgColor" oninput="updatePreview()"></div>
        </div>
    </div>

    <div class="card">
        <h3>👤 單人名牌預覽</h3>
        <div class="grid">
            <div><label>中文姓名</label><input type="text" id="s_zh" placeholder="例如: 洪吉童" value="洪吉童" oninput="updatePreview()"></div>
            <div><label>外文姓名</label><input type="text" id="s_en" placeholder="例如: 홍길동" value="홍길동" oninput="updatePreview()"></div>
        </div>
        
        <div class="preview-container">
            <p style="margin-top:0; color:#555; font-size:0.9em;">即時預覽 (橫向方便閱讀，下載時將自動旋轉 270 度)</p>
            <canvas id="previewCanvas"></canvas>
        </div>
        <button class="btn-secondary" onclick="downloadSingleBadge()">📥 下載此單張名牌</button>
    </div>

    <div class="card">
        <h3>📂 批次產生 (Excel上傳)</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="margin-bottom: 10px;">
        <button id="generateBtn" onclick="generateBatchBadges()">🚀 批次產生並下載 ZIP</button>
    </div>

<script>
    const presets = {
        "手機藍白": { w: 1920, h: 1080, bg: "#0B3D91", fg: "#FFFFFF", font: 250, gap: 100 },
        "A4黑白": { w: 3508, h: 2480, bg: "#FFFFFF", fg: "#000000", font: 400, gap: 150 }
    };

    function getConfig() {
        return {
            width: parseInt(document.getElementById("imgW").value) || 1920,
            height: parseInt(document.getElementById("imgH").value) || 1080,
            bg: document.getElementById("bgColor").value || "#0B3D91",
            fg: document.getElementById("fgColor").value || "#FFFFFF",
            fontPx: parseInt(document.getElementById("fontPx").value) || 250,
            gapPx: parseInt(document.getElementById("gapPx").value) || 100,
            foreignFirst: document.getElementById("foreignFirst").checked,
            fontFamily: document.getElementById("fontSelect").value
        };
    }

    async function applyPreset() {
        const val = document.getElementById("presetSelect").value;
        const p = presets[val];
        document.getElementById("imgW").value = p.w;
        document.getElementById("imgH").value = p.h;
        document.getElementById("bgColor").value = p.bg;
        document.getElementById("fgColor").value = p.fg;
        document.getElementById("fontPx").value = p.font;
        document.getElementById("gapPx").value = p.gap;
        await updatePreview();
    }

    function renderBadgeOnCanvas(canvas, en, zh, cfg) {
        canvas.width = cfg.width;
        canvas.height = cfg.height;
        
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = cfg.bg;
        ctx.fillRect(0, 0, cfg.width, cfg.height);

        ctx.fillStyle = cfg.fg;
        ctx.textAlign = 'center';
        ctx.font = `${cfg.fontPx}px ${cfg.fontFamily}, sans-serif`;

        const centerX = cfg.width / 2;
        const centerY = cfg.height / 2;

        if (en && zh) {
            const topText = cfg.foreignFirst ? en : zh;
            const bottomText = cfg.foreignFirst ? zh : en;

            ctx.textBaseline = 'bottom';
            ctx.fillText(topText, centerX, centerY - (cfg.gapPx / 2));
            
            ctx.textBaseline = 'top';
            ctx.fillText(bottomText, centerX, centerY + (cfg.gapPx / 2));
        } else if (en || zh) {
            const text = en || zh;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, centerX, centerY);
        }
    }

    function getRotatedCanvas(sourceCanvas) {
        const rotatedCanvas = document.createElement('canvas');
        rotatedCanvas.width = sourceCanvas.height;
        rotatedCanvas.height = sourceCanvas.width;
        
        const ctx = rotatedCanvas.getContext('2d');
        ctx.translate(0, sourceCanvas.width);
        ctx.rotate(-Math.PI / 2);
        
        ctx.drawImage(sourceCanvas, 0, 0);
        return rotatedCanvas;
    }

    // 專門處理下拉選單切換字體時的提示
    async function handleFontChange() {
        const statusEl = document.getElementById('status');
        statusEl.innerText = "⏳ 正在下載新字體，請稍候 (初次切換約需幾秒鐘)...";
        statusEl.style.color = "#0B3D91";
        
        await updatePreview();
        
        statusEl.innerText = "✅ 字體切換成功！";
        statusEl.style.color = "#4CAF50";
        setTimeout(() => { 
            if(statusEl.innerText.includes("切換成功")) statusEl.innerText = ""; 
        }, 2000);
    }

    // 將 updatePreview 改成非同步 (async)，確保字體準備好才畫圖
    async function updatePreview() {
        const canvas = document.getElementById("previewCanvas");
        const cfg = getConfig();
        const en = document.getElementById("s_en").value.trim();
        const zh = document.getElementById("s_zh").value.trim();
        
        // 【關鍵修復】: 強迫畫布等待字體從 Google 下載到記憶體後，才開始畫圖！
        const textToLoad = (en + zh) || "中英測試文字";
        try {
            await document.fonts.load(`${cfg.fontPx}px ${cfg.fontFamily}`, textToLoad);
        } catch(e) {
            console.log("字體載入中...");
        }

        renderBadgeOnCanvas(canvas, en, zh, cfg);
    }

    function downloadSingleBadge() {
        const sourceCanvas = document.getElementById("previewCanvas");
        const finalCanvas = getRotatedCanvas(sourceCanvas); 
        
        const en = document.getElementById("s_en").value.trim();
        const zh = document.getElementById("s_zh").value.trim();
        const fileName = `${zh || en || '名牌'}.png`;
        
        finalCanvas.toBlob(blob => saveAs(blob, fileName), "image/png");
    }

    async function generateBatchBadges() {
        const fileInput = document.getElementById('excelFile');
        if (!fileInput.files.length) { alert("請先上傳 Excel！"); return; }

        document.getElementById('status').innerText = "處理資料中...";
        document.getElementById('status').style.color = "#0B3D91";
        document.getElementById('generateBtn').disabled = true;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {defval: ""});

                const cfg = getConfig();
                
                // 批次產生前，先確保字體已經載入
                await document.fonts.load(`${cfg.fontPx}px ${cfg.fontFamily}`);

                const zip = new JSZip();
                const promises = [];
                let validCount = 0;

                json.forEach((row) => {
                    const en = (row['Kor.'] || row['Eng.'] || row['外文姓名'] || "").toString().trim();
                    const zh = (row['Chn.'] || row['中文姓名'] || "").toString().trim();
                    if (!en && !zh) return;
                    
                    validCount++;
                    
                    const tempCanvas = document.createElement('canvas');
                    renderBadgeOnCanvas(tempCanvas, en, zh, cfg);
                    
                    const finalCanvas = getRotatedCanvas(tempCanvas);
                    
                    promises.push(new Promise(res => finalCanvas.toBlob(b => {
                        zip.file(`${zh || en}_${validCount.toString().padStart(3, '0')}.png`, b);
                        res();
                    }, 'image/png')));
                });

                await Promise.all(promises);
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, "badges.zip");
                document.getElementById('status').innerText = `✅ 成功產生 ${validCount} 張！已下載 ZIP。`;
                document.getElementById('status').style.color = "#4CAF50";
            } catch (err) {
                document.getElementById('status').innerText = "錯誤：" + err.message;
                document.getElementById('status').style.color = "#d9534f";
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    window.onload = async () => {
        applyPreset();
        // 確保剛開網頁時的字體也有被正確載入並畫出
        await document.fonts.ready;
        updatePreview();
    };
</script>
</body>
</html>
